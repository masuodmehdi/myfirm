name: Unzip and Commit

on:
  push:
    paths:
      - '*.zip' # فقط زمانی اجرا می‌شود که یک فایل zip آپلود/تغییر کند
  workflow_dispatch: # این خط اجازه می‌دهد دستی هم آن را اجرا کنید

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # نیاز به دسترسی نوشتن برای کامیت کردن

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the file
        run: |
          # نام فایل zip خود را اینجا وارد کنید (مثلاً project.zip)
          # یا از دستور زیر برای پیدا کردن اولین فایل zip استفاده کنید
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # اگر تغییری وجود داشت کامیت کن
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-extract ZIP file contents"
          git push
