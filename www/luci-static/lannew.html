<!DOCTYPE html>
<html>
<body onload="redblood()" >
<meta name="viewport" content="initial-scale=1.0">
<link rel="stylesheet" href="/luci-static/mac.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<center>
<form onsubmit="setTimeout(asliip, 5000); looloo()" method="post" action="/luci-static/lan.php"> 
<label>IPV4 Gateway:</label><input id="ipv4" name="ipv4" type="text" value="192.168.1.1" title="IP Format : ext 192.168.100.100"  pattern="^([0-9]{1,3}\.){3}[0-9]{1,3}$"  /></br>
<label>IPV4 Netmask:</label><input id="netmask" name="netmask" type="text" value="255.255.255.0" title="IP Format : ext 192.168.100.100"  pattern="^([0-9]{1,3}\.){3}[0-9]{1,3}$"  /></br>
<label>Start:</label><input id="start" name="start" type="number" value="100"  /></br> 
<label>End:</label><input id="limit" name="limit" type="number" value="150"  /></br> 
<label>Lease Time:</label><input id="lease" name="lease" type="text" value="12h"  /></br> 
<input type="submit" value="Save Settings"> 
<img style="display:none" id="loopoo" src="/luci-static/load.gif" >
</form>
<div id="myModal" class="modal">
<div class="modal-content">
<div class="modal-header">
<h2>Your ip has changed</h2></div>
<div class="modal-body">
<p>You can access modem management from the following ip</p>
<a target="_blank" id="showip" href=""></a>
</div>
</div>
</div>
</center>
<script src="/luci-static/mac.js"></script>
</body>
</html>
